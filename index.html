<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 入力した金額が端末の外へ出る経路を、ブラウザ側にも禁止させる（設計原則1の多層防御）。
     GitHub Pages はレスポンスヘッダを設定できないため meta で宣言する。
     'self' 以外への通信・スクリプト・画像の読み込みと、フォーム送信をすべて塞ぐ。
     ★外部リソースを1つでも足すときは、ここを直さないと動かない。それが狙い。
     リンク集の外部リンク（別タブで開く画面遷移）は CSP の対象外なので影響しない。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>税額ポケット</title>
<meta name="description" content="関与先で使う税額計算ツール">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<!-- iOS はホーム画面のアイコンに PNG を要求する（SVG は不可） -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<!-- manifest の display: standalone は iOS 11.3 以降が解釈する。
     次の2行は旧OSとスプラッシュ等の挙動のための保険として併記している -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="税額ポケット">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
<header class="appbar">
  <a class="appbar__back" id="back" href="#/" hidden>メニュー</a>
  <span class="appbar__title">税額ポケット</span>
</header>

<main id="app"></main>

<footer class="disclaimer">
  <p>本ツールの計算結果は概算であり、申告その他の税務判断の根拠として用いることはできません。実際の税額は個別の事情により異なります。</p>
</footer>

<script type="module" src="./src/app.js"></script>
</body>
</html>
