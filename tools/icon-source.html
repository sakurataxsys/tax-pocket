<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アイコンの原稿</title>
<!--
  icons/*.png の原稿。画像ライブラリを増やさないため、この画面を
  ビューポートちょうどのサイズでスクリーンショットして PNG を作る。

    node tools/serve.mjs
    → http://localhost:8080/tools/icon-source.html を 512x512 / 192x192 / 180x180 で撮る

  事務所ブランド配色（紺・金・桜）は使わない（設計原則5）。
  文字はホーム画面アイコンの丸い切り抜き（maskable のセーフゾーン＝中央80%）に収まる大きさにしている。
-->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2c2f36;
  }
  span {
    color: #ffffff;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    font-size: 46vmin;
    font-weight: 600;
    line-height: 1;
    user-select: none;
  }
</style>
</head>
<body><span>税</span></body>
</html>
