<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アイコンの原稿</title>
<!--
  icons/*.png を作る道具。**画像ライブラリは増やさない**。canvas で合成して書き出す。

    node tools/serve.mjs
    → http://localhost:8080/tools/icon-source.html
    → 「書き出す」を押すと icons/ の3枚が置き換わる

  材料は2つ。
    tools/icon-base.png … 下絵（225×225）。ポケットと電卓。生成AIに描かせた案から1枚を
                           切り出し、右下にあった桜を左右対称の位置から写して消したもの
    tools/logo-mark.png … 事務所のロゴ（桜）。事務所名は使わない（判断ログ D-34）

  ★maskable：OSがアイコンを丸く切り抜く。中身は中心から半径0.4の内側に収める。
    下絵を 0.78 倍で置いているのはそのため（0.90 だと 0.459 まで届いて切れる）。
    このページで実測しているので、値を変えたら必ず確認すること。

  ★下絵は角丸の絵なので、そのまま置くと角に白が残る。
    地を下絵と同じ紺で塗り、角丸のパスで切り抜いてから重ねている。
    地の紺 rgb(15,37,74) は下絵の縁から採った値。ずらすと輪郭が見える。

  ★Image.decode() は使わない。この環境で解決しないままページが止まることがあった。onload で待つ。
-->
<style>
  body { margin:0; padding:2rem; background:#f5f5f7; font-family:system-ui,sans-serif; color:#16181d; }
  h1 { font-size:1.125rem; margin:0 0 0.5rem; }
  .lead { font-size:0.8125rem; color:#71757e; margin:0 0 2rem; }
  .row { display:flex; gap:2rem; align-items:flex-start; flex-wrap:wrap; }
  figure { margin:0; }
  figcaption { font-size:0.75rem; color:#71757e; margin-top:0.625rem; }
  canvas { display:block; box-shadow:0 1px 2px rgba(0,0,0,.1), 0 6px 20px rgba(0,0,0,.08); }
  .maru { border-radius:50%; }
  button { margin-top:1.5rem; font-size:0.875rem; padding:0.5rem 1rem; }
  #check { margin-top:2rem; font-size:0.8125rem; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>税額ポケット — アイコン</h1>
<p class="lead">左が実際のホーム画面に近い大きさ（132px・丸く切り抜いた状態）、右が確認用です。</p>
<div class="row" id="out"></div>
<button id="save">icons/ に書き出す（512・192・180）</button>
<div id="check"></div>

<script>
const JI = "rgb(15,37,74)";   // 地の紺。下絵の縁から採った値
const SCALE = 0.78;           // 下絵を置く倍率（セーフゾーンに収まる上限）
const LOGO_W = 0.20;          // ロゴの幅（辺に対する比）
const LOGO_X = 0.715;         // 下絵の中でのロゴの位置（元の桜があった場所）
const LOGO_Y = 0.740;

const load = (src) =>
  new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error(`読めない: ${src}`));
    i.src = src;
  });

function egaku(base, logo, S) {
  const cv = document.createElement("canvas");
  cv.width = S; cv.height = S;
  const c = cv.getContext("2d");
  c.fillStyle = JI;
  c.fillRect(0, 0, S, S);
  const k = S * SCALE, off = (S - k) / 2;
  c.save();
  c.beginPath();
  c.roundRect(off, off, k, k, k * 0.24); // 下絵の角丸に合わせて切り抜く
  c.clip();
  c.drawImage(base, off, off, k, k);
  c.restore();
  const lw = S * LOGO_W, lh = lw * (logo.naturalHeight / logo.naturalWidth);
  c.drawImage(logo, off + k * LOGO_X - lw / 2, off + k * LOGO_Y - lh / 2, lw, lh);
  return cv;
}

/** 中身（生成り・金・桜）が中心からどこまで届くか。0.4以下なら丸く切られても欠けない */
function jikoTenken(base, logo) {
  const S = 256;
  const d = egaku(base, logo, S)
    .getContext("2d", { willReadFrequently: true })
    .getImageData(0, 0, S, S).data;
  let max = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
    const naka =
      (r > 190 && g > 180 && b > 160) ||            // 生成り
      (r > 170 && g > 130 && b < 130) ||            // 金
      (r > 200 && g > 120 && g < 200 && b > 130 && b < 205 && r - g > 35); // 桜
    if (!naka) continue;
    const rr = Math.hypot(x - S / 2, y - S / 2) / S;
    if (rr > max) max = rr;
  }
  return max;
}

const SIZES = [
  { size: 512, file: "icon-512.png" },
  { size: 192, file: "icon-192.png" },
  { size: 180, file: "apple-touch-icon-180.png" },
];

(async () => {
  const [base, logo] = await Promise.all([
    load("/tools/icon-base.png"),
    load("/tools/logo-mark.png"),
  ]);
  const out = document.getElementById("out");

  for (const [size, label, maru] of [
    [132, "ホーム画面での見え方（丸く切り抜き）", true],
    [256, "確認用", false],
  ]) {
    const fig = document.createElement("figure");
    const cv = egaku(base, logo, 512);
    cv.style.width = cv.style.height = size + "px";
    if (maru) cv.className = "maru";
    const cap = document.createElement("figcaption");
    cap.textContent = label;
    fig.append(cv, cap);
    out.append(fig);
  }

  const todoke = jikoTenken(base, logo);
  document.getElementById("check").textContent =
    `セーフゾーンの実測：中身の最大半径 ${todoke.toFixed(3)}（0.4以下なら丸く切られても欠けない）` +
    (todoke > 0.4 ? "\n★超えている。SCALE を小さくすること。" : "");

  const save = async () => {
    const r = [];
    for (const s of SIZES) {
      const res = await fetch("/__save-icon", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          file: s.file,
          dataurl: egaku(base, logo, s.size).toDataURL("image/png"),
        }),
      });
      r.push({ file: s.file, ok: res.ok });
    }
    return r;
  };
  document.getElementById("save").onclick = async (e) => {
    e.target.disabled = true;
    const r = await save();
    e.target.textContent = r.every((x) => x.ok) ? "書き出した" : "失敗";
  };
  window.kakidashi = save;
  window.tenken = () => Number(jikoTenken(base, logo).toFixed(3));
})();
</script>
</body>
</html>
